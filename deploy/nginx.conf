server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /projects/ { proxy_pass http://api:8000; proxy_buffering off; }
    location /jobs/ { proxy_pass http://api:8000; proxy_buffering off; }
    location /settings { proxy_pass http://api:8000; }
    location /media/ { proxy_pass http://api:8000; }
    location /browse { proxy_pass http://api:8000; }
    location /health { proxy_pass http://api:8000; }
    location /events { proxy_pass http://api:8000; proxy_buffering off; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
