[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-video-editor"
version = "0.1.0"
description = "Desktop-local agentic video editor that cuts footage to match a reference's pacing"
readme = "docs/Local Agentic Video Editor — Build Plan.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "scenedetect[opencv]>=0.6.5",
  "keyring>=25",
  "opentimelineio>=0.17",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
ml = [
  "open-clip-torch>=2.26",
  "torch>=2.3",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
editor = "ave.cli:app"

[tool.setuptools.packages.find]
include = ["ave*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
